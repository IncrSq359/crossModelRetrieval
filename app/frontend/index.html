<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>跨模态检索演示</title>
    <link rel="stylesheet" href="style.css"
</head>
<body>
    <h1>跨模态检索演示</h1>
    <!--输入区-->
    <div id="input-area">
        <input type="text" id="text-query" placeholder="例如: a dog running on grass">
        <button id="btn-search-text">点击提交</button>
        <input type="file" id="image-file" accept="image/*">
    </div>
    <!--状态栏：显示耗时和检索后端-->
    <div id="status-bar"></div>
    <!--结果网格：之后由代码往里面放图片卡片-->
    <div id="results"></div>
</body>
</html>
