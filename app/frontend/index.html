<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>跨模态检索 · Flickr30k</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
    <header class="head">
        <div class="head-top">
            <p class="kicker">实验四 · 端到端系统集成与演示</p>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
                <svg class="icon-sun" viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
                    <circle cx="10" cy="10" r="3.4" stroke="currentColor" stroke-width="1.4"/>
                    <path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4"
                          stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
                <svg class="icon-moon" viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
                    <path d="M16.2 12.6A6.5 6.5 0 0 1 7.4 3.8a6.5 6.5 0 1 0 8.8 8.8Z"
                          stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
        <div class="head-title-row">
            <h1>跨模态检索</h1>
            <p class="lede">以英文描述或参考图像，在 Flickr30k 图库中定位语义相近的画面。</p>
        </div>
    </header>

    <section class="search-panel" aria-label="检索控制区">
        <div class="search">
            <span class="search-icon" aria-hidden="true">
                <svg viewBox="0 0 20 20" width="18" height="18" fill="none">
                    <circle cx="8.75" cy="8.75" r="5.5" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M13 13l4.25 4.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </span>
            <input type="text" id="text-query" placeholder="a dog running on grass"
                   autocomplete="off" spellcheck="false" autofocus>
            <button id="btn-search-text" type="button" aria-label="检索">
                <span class="btn-label">检索</span>
                <svg class="btn-arrow" viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
                    <path d="M3.5 10h12.5M11 5l5 5-5 5" stroke="currentColor" stroke-width="1.6"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>

        <div class="sub">
            <label class="upload" id="image-dropzone" for="image-file">
                <span class="upload-icon" aria-hidden="true">
                    <svg viewBox="0 0 20 20" width="15" height="15" fill="none">
                        <rect x="2.75" y="4" width="14.5" height="12" rx="1.8" stroke="currentColor" stroke-width="1.4"/>
                        <circle cx="7.2" cy="8.2" r="1.15" fill="currentColor"/>
                        <path d="M3.5 14l4.2-4.1 3 2.9 2.2-2.1 3.6 3.3" stroke="currentColor" stroke-width="1.4"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                <img id="query-preview" class="query-preview" alt="" hidden>
                <span class="upload-text">以图搜图</span>
                <span class="upload-hint" id="dropzone-hint">点击选择或拖拽图片到此处</span>
                <input type="file" id="image-file" accept="image/*" class="visually-hidden">
            </label>

            <div class="examples" aria-label="示例查询">
                <span class="examples-label">示例</span>
                <button class="example" type="button" data-query="a dog running on grass">a dog running on grass</button>
                <button class="example" type="button" data-query="two people hiking in the mountains">two people hiking</button>
                <button class="example" type="button" data-query="a man playing guitar on stage">a man playing guitar</button>
                <button class="example" type="button" data-query="children playing near the ocean waves">children at the beach</button>
            </div>
        </div>
    </section>

    <div class="status-row">
        <p id="status-bar" class="status" role="status" aria-live="polite"></p>
    </div>

    <main>
        <div id="results" class="grid"></div>
    </main>

    <footer class="foot">
        <span>Flickr30k 跨模态图库</span>
        <span>余弦相似度降序排列</span>
    </footer>
</div>

<div id="lightbox" aria-hidden="true" tabindex="-1" role="dialog" aria-modal="true" aria-label="图片详情">
    <button id="lightbox-close" class="lb-close" type="button" aria-label="关闭大图">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" aria-hidden="true">
            <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
    </button>

    <button id="lightbox-prev" class="lb-nav lb-prev" type="button" aria-label="上一张">
        <svg viewBox="0 0 20 20" width="20" height="20" fill="none" aria-hidden="true">
            <path d="M12.5 4.5L7 10l5.5 5.5" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <div class="lb-stage" id="lightbox-stage">
        <div class="lb-media">
            <img id="lightbox-img" alt="">
        </div>
        <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>

    <button id="lightbox-next" class="lb-nav lb-next" type="button" aria-label="下一张">
        <svg viewBox="0 0 20 20" width="20" height="20" fill="none" aria-hidden="true">
            <path d="M7.5 4.5L13 10l-5.5 5.5" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <p class="lightbox-hint">← / → 切换 · 点击空白处或 ESC 关闭</p>
</div>

<script src="app.js"></script>
</body>
</html>
